[build]
  # Root directory of the frontend
  base = "frontend"
  # Build command (executed inside base directory)
  command = "npm run build"
  # Output directory (relative to base directory)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing — redirect all routes to index.html so React SPA routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
